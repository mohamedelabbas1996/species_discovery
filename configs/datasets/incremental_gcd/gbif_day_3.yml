dataset:
  name: gbif_day_0
  num_all_classes: 637
  num_classes: 636
  max_classes: 2500
  pre_size: 128
  image_size: 126

  interpolation: bilinear
  normalization_type: imagenet

  num_workers: '@{num_workers}'
  num_gpus: '@{num_gpus}'
  num_machines: '@{num_machines}'

  split_names: [train, val, test]

  train:
    dataset_class: ImglistDataset
    data_dir: /network/scratch/y/yuyan.chen/ami_gbif_train_resized_new/
    imglist_pth:  /network/scratch/y/yuyan.chen/species_discovery/metadata/
    batch_size: 128
    shuffle: True
    len: 
    use_mixres: True
    dataaug: randaug
    rescale_size: None


  val:
    dataset_class: ImglistDataset
    data_dir: /network/scratch/y/yuyan.chen/ami_gbif_train_resized_new/
    imglist_pth:  /network/scratch/y/yuyan.chen/species_discovery/metadata/
    batch_size: 128
    shuffle: False

  test:
    dataset_class: ImglistDataset
    data_dir: /network/scratch/y/yuyan.chen/ami_gbif_train_resized_new/
    imglist_pth: /network/scratch/y/yuyan.chen/species_discovery/metadata/
    batch_size: 128
    shuffle: False


  
