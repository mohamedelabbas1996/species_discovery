dataset:
  name: panama
  num_classes: 2360
  num_closed_set: 2360
  pre_size: 128
  image_size: 126

  interpolation: bilinear
  normalization_type: imagenet

  num_workers: '@{num_workers}'
  num_gpus: '@{num_gpus}'
  num_machines: '@{num_machines}'

  split_names: [train, val, test]

  train:
    dataset_class: ImglistDataset
    data_dir: /network/scratch/y/yuyan.chen/ami_gbif_train_resized/
    imglist_pth: /network/scratch/y/yuyan.chen/species_discovery/metadata/classification/panama_train.txt
    batch_size: 128
    shuffle: True
    len: 163759
    use_mixres: True
    dataaug: randaug

  val:
    dataset_class: ImglistDataset
    data_dir: /network/scratch/y/yuyan.chen/ami_gbif_train_resized/
    imglist_pth: /network/scratch/y/yuyan.chen/species_discovery/metadata/classification/panama_val.txt
    batch_size: 128
    shuffle: False
  test:
    dataset_class: ImglistDataset
    data_dir: /network/scratch/y/yuyan.chen/ami_gbif_train_resized/
    imglist_pth: /network/scratch/y/yuyan.chen/species_discovery/metadata/classification/panama_test.txt
    batch_size: 128
    shuffle: False

    