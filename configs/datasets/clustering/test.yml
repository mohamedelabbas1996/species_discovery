dataset:
  name: ami_c-america
  num_classes: 636
  num_all_classes: 637
  max_classes: 2500
  pre_size: 128
  image_size: 126

  interpolation: bilinear
  normalization_type: imagenet

  num_workers: '@{num_workers}'
  num_gpus: '@{num_gpus}'
  num_machines: '@{num_machines}'

  split_names: [train, val, test, test_labeled, test_unlabeled]

  train:
    dataset_class: ImglistDataset
    data_dir: /network/scratch/y/yuyan.chen/ami_gbif_train_resized_new/
    imglist_pth:  ./data/03_c-america_train_id.txt
    batch_size: 128
    input_size: 128
    shuffle: True
    len: 1908
    use_mixres: True
    dataaug: randaug
    rescale_size: None
  val:
    dataset_class: ImglistDataset
    data_dir: /network/scratch/y/yuyan.chen/ami_gbif_train_resized_new/
    imglist_pth: ./data/03_c-america_val_id.txt
    batch_size: 128
    shuffle: False
  test:
    dataset_class: ImglistDataset
    data_dir: /network/scratch/y/yuyan.chen/ami_gbif_train_resized_new/
    imglist_pth: ./data/03_c-america_test_id.txt
    batch_size: 128
    input_size: 128
    shuffle: False
  test_labeled:
    dataset_class: ImglistDataset
    data_dir: /network/scratch/y/yuyan.chen/ami_gbif_train_resized_new/
    imglist_pth: ./data/03_c-america_test_id.txt
    batch_size: 128
    input_size: 128
    shuffle: False
  test_unlabeled:
    dataset_class: ImglistDataset
    data_dir: /network/scratch/y/yuyan.chen/ami_gbif_train_resized_new/
    imglist_pth: ./data/03_c-america_test_id.txt
    batch_size: 128
    input_size: 128
    shuffle: False


  
