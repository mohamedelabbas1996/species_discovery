dataset:
  name: ami_c-america
  num_classes: 636
  max_classes: 2500
  pre_size: 128
  image_size: 126

  interpolation: bilinear
  normalization_type: imagenet

  num_workers: '@{num_workers}'
  num_gpus: '@{num_gpus}'
  num_machines: '@{num_machines}'

  split_names: [test_labeled, test_unlabeled]

  test_labeled:
    dataset_class: ImglistDataset
    data_dir: /network/scratch/y/yuyan.chen/ami_gbif_train_resized/
    imglist_pth: ./data/03_c-america_test_id.txt
    batch_size: 128
    input_size: 128
    shuffle: False
  
  test_unlabeled:
    dataset_class: ImglistDataset
    data_dir: /network/scratch/y/yuyan.chen/ami_gbif_train_resized/
    imglist_pth: ./data/03_c-america_test_id.txt
    batch_size: 128
    input_size: 128
    shuffle: False


  
