dataset:
  name: ami_c-america
  num_classes: 636
  pre_size: 128
  image_size: 126
  max_count: 1000

  interpolation: bilinear
  normalization_type: imagenet

  num_workers: '@{num_workers}'
  num_gpus: '@{num_gpus}'
  num_machines: '@{num_machines}'

  split_names: [train, val, test]

  train:
    dataset_class: AMIDataFrame
    data_dir: /network/scratch/y/yuyan.chen/ami_gbif_train_resized/
    imglist_pth:  ./data/03_c-america_train_merged_320.csv
    batch_size: 128
    shuffle: True
    len: 1772
  val:
    dataset_class: ImglistDataset
    data_dir: /network/scratch/y/yuyan.chen/ami_gbif_train_resized/
    imglist_pth: ./data/03_c-america_val_id.txt
    batch_size: 128
    shuffle: False
  test:
    dataset_class: ImglistDataset
    data_dir: /network/scratch/y/yuyan.chen/ami_gbif_train_resized/
    imglist_pth: ./data/03_c-america_test_id.txt
    batch_size: 128
    shuffle: False
  
  eval_config_path: configs/datasets/ami/posthoc/c-america.yaml

    